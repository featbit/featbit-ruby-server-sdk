name: Release gem

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: Production

    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Verify tag matches gem version
        shell: bash
        run: |
          version="$(ruby -Ilib -rfeatbit/version -e 'print FeatBit::VERSION')"
          test "v${version}" = "${GITHUB_REF_NAME}"

      - name: Run tests
        run: bundle exec rspec

      - name: Run RuboCop
        run: bundle exec rubocop

      - name: Run resource audit
        run: bundle exec ruby scripts/resource_audit.rb

      - uses: rubygems/release-gem@v1
